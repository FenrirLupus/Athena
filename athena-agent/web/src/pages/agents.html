<!DOCTYPE html>
<!--
  html/settings.html — the SETTINGS page: what is in force, read-only.

  The config file is the interface (documentation/architecture/08-config.md): it is commented, diffable
  and editable in the operator's own editor. A web form here would be a second place to change the same
  value, and the two would drift. So this page *shows* the merged defaults + overrides, the paths, and
  the models on disk — and says where to change them.

  Header = information. Navbar = pages. Page navbar = sections of this page.
-->
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <script src="../js/dom.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents · Athena</title>
  <link rel="stylesheet" href="../css/palette.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/page.css">
</head>
<body data-page="agents">

  <!-- 1 · GLOBAL HEADER — information only -->
{{header}}    <nav class="global-nav" aria-label="Main navigation">
    <div class="nav-links">
          <a class="nav-link" href="../index.html" data-page="home">Home</a>
          <a class="nav-link" href="chat.html" data-page="chat">Chat</a>
          <a class="nav-link" href="call.html" data-page="call">Call</a>
          <a class="nav-link active" href="agents.html" data-page="agents">Agents</a>
          <a class="nav-link" href="settings.html" data-page="settings">Settings</a>
        </div>
    <div class="nav-tools">
      <button class="nav-icon" id="bell" type="button" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
          <path d="M8 1.6a3.6 3.6 0 0 0-3.6 3.6v2.5L3 10.2h10L11.6 7.7V5.2A3.6 3.6 0 0 0 8 1.6z" fill="currentColor"/>
          <path d="M6.6 11.4a1.5 1.5 0 0 0 2.8 0z" fill="currentColor"/>
        </svg>
      </button>
      <div class="notif-panel" id="notif-panel" hidden role="dialog" aria-label="notifications">
        <div class="notif-head">
          <span>Notifications</span>
          <span class="notif-actions">
            <button class="notif-action" id="notif-read-all" type="button">Mark as Read</button>
            <button class="notif-action" id="notif-clear-all" type="button">Clear All</button>
            <button class="notif-clear" id="notif-close" type="button" aria-label="close">×</button>
          </span>
        </div>
        <ul class="notif-list" id="notif-list"><li class="notif-empty muted small">nothing yet</li></ul>
      </div>
      <button class="nav-avatar" id="avatar" type="button" aria-label="Account">DJ</button>
    </div>
  </nav>

  <!-- 2 · GLOBAL NAVBAR — pages only -->

  <!-- 3 · GLOBAL BODY -->
  <main id="global-body" data-layer="3">
    <div id="page-root">

      <!-- 5 · PAGE HEADER — 6 · PAGE NAVBAR inside it -->
      <header id="page-header" data-layer="5">
        <div class="page-heading">
          <h1>Settings</h1>
          <p class="page-subtitle">
            What is in force right now — defaults merged with your overrides. Values are changed in
            <code>~/.athena/config.yaml</code>, which is the interface; this page is a reading of it.
          </p>
        </div>
      </header>

      <!-- 7 · PAGE BODY -->
      <nav class="page-nav" id="agent-bar" aria-label="agents"></nav>
      <section id="page-body">
        <div class="licence" id="agent-editor">
          <p class="muted small">loading…</p>
        </div>
      </section>
      <footer id="page-footer" data-layer="8">
        <span class="footer-text"></span>
      </footer>
    </div>
  </main>

  <!-- 4 · GLOBAL FOOTER — three columns: context use, version, endpoints -->
{{footer}}
  <template id="tpl-model-row">
    <tr>
      <td class="strong" data-cell="name"></td>
      <td data-cell="format"></td>
      <td data-cell="quant"></td>
      <td class="num" data-cell="size"></td>
      <td class="muted" data-cell="repo"></td>
    </tr>
  </template>

  <script src="../js/live.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/approvals.js"></script>
  <script src="../js/terminal.js"></script>
  <script src="../js/page-specs.js"></script>
  <script src="../js/notif.js"></script>
  <div class="acct-veil" id="acct-veil" hidden role="dialog" aria-modal="true" aria-label="account profile">
    <div class="acct-panel">
      <div class="acct-head">
        <span class="acct-title">Account</span>
        <button class="acct-close" id="acct-close" type="button" aria-label="close">×</button>
      </div>
      <div class="acct-body" id="acct-body"><p class="muted small">loading…</p></div>
    </div>
  </div>
  <script src="../js/account.js"></script>
  <script src="../js/console-tap.js"></script>
  <script src="../js/agents-page.js"></script>
  <script src="../js/accent.js"></script>
</body>
</html>
